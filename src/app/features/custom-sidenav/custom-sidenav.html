<div class="text-center pt-6">
  <img
    class="avatar inline-block my-4 rounded-full 
    [box-shadow:0px_5px_5px_-3px_rgba(0,0,0,0.2),0px_8px_10px_1px_rgba(0,0,0,0.14),0px_3px_14px_2px_rgba(0,0,0,0.12)]"
    src="https://randomuser.me/api/portraits/women/45.jpg"
    [width]="profilePicSize()"
    [height]="profilePicSize()"
  />
  <div class="h-12 text-black info" [class.hide-header-text]="collapsed()">
    <h2 class="m-0 font-medium text-lg leading-6 ">Your Channel</h2>
    <p class="m-0 text-sm" >Joahn Smith</p>
  </div>
</div>
<mat-nav-list>
  @for (item of menuItems(); track $index) {
    <app-menu-item [item]="item" [collapsed]="collapsed()" />  
  }
</mat-nav-list>
