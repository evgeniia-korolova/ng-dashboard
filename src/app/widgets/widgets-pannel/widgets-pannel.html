<div class="flex flex-col gap-2 p-6 rounded-2">
  <div class="flex gap-2 items-center">
    <mat-icon>drag_indicator</mat-icon>
    Widgets
  </div>
  @for (widget of dashboardService.widgetsToAdd(); track widget.id) {
  <div
    class="flex items-center justify-center rounded-lg cursor-pointer px-4 py-2 text-base widget-box"    
    cdkDrag
    [cdkDragData]="widget.id"
  >
    {{ widget.label }}
    <div *cdkDragPlaceholder></div>
  </div>
  }
</div>
