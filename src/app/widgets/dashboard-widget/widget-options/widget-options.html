<button matIconButton class="close-btn" (click)="showOptions.set(false)">
  <mat-icon>close</mat-icon>
</button>
<div>
  Width
  <mat-button-toggle-group
    hideSingleSelectionIndicator="true"
    [value]="data().columns ?? 1"
    (change)="dashboardService.updateWidget(data().id, { columns: +$event.value })"
  >
    <mat-button-toggle [value]="1">1</mat-button-toggle>
    <mat-button-toggle [value]="2">2</mat-button-toggle>
    <mat-button-toggle [value]="3">3</mat-button-toggle>
    <mat-button-toggle [value]="4">4</mat-button-toggle>
  </mat-button-toggle-group>
</div>
<div>
  Hight
  <mat-button-toggle-group
    hideSingleSelectionIndicator="true"
    [value]="data().rows ?? 1"
    (change)="dashboardService.updateWidget(data().id, { rows: +$event.value })"
  >
    <mat-button-toggle [value]="1">1</mat-button-toggle>
    <mat-button-toggle [value]="2">2</mat-button-toggle>
    <mat-button-toggle [value]="3">3</mat-button-toggle>
    <mat-button-toggle [value]="4">4</mat-button-toggle>
  </mat-button-toggle-group>
</div>

<button matIconButton class="move-forward-btn" (click)="dashboardService.moveWidgetToRight(data().id)"  >
  <mat-icon>chevron_right</mat-icon>
</button>

<button matIconButton class="move-backwards-btn" (click)="dashboardService.moveWidgetToLeft(data().id)">
  <mat-icon>chevron_left</mat-icon>
</button>

<button matIconButton class="remove-widget-btn" (click)="dashboardService.removeWidget(data().id)" >
  <mat-icon>delete</mat-icon>
</button>
