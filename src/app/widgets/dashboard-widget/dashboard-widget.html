<div
  class="w-full h-full relative p-5 overflow-hidden box-border rounded-[inherit] mat-elevation-z3"
  [style.background-color]="data().backgroundColor?.[theme()] ?? 'var(--mat-sys-surface-bright)'"
  [style.color]="data().color?.[theme()] ?? 'inherit'"
  cdkDrag
  cdkDragPreviewContainer="parent"
>
<div class="cursor-move">
  <h3 class="mb-3">{{ data().label }}</h3>
  <button
    matIconButton
    class="settings-button"
    (click)="showOptions.set(true)"
    [style.color]="data().color?.[theme()] ?? 'var(--mat-sys-inverse-surface)'"
  >
    <mat-icon>settings</mat-icon>
  </button>
</div>
  <ng-container [ngComponentOutlet]="data().content" />
  @if (showOptions()) {
  <app-widget-options [(showOptions)]="showOptions" [data]="data()" />
  }
  <div *cdkDragPlaceholder></div>
</div>
