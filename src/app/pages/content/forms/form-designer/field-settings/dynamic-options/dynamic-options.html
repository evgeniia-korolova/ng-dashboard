<div>
    <div class="flex items-center justify-between">
        <h3 class="font-medium">{{title()}} </h3>
        <button matIconButton (click)="addOption()">
            <mat-icon>add_circle</mat-icon>
        </button>
    </div>
    <div class="flex flex-col gap-2 mb-4 mt-2">
        @for (option of options(); track option.value; let i = $index) {
            <div class="flex items-center">
                <mat-form-field appearance="outline" class="flex-1 compact">
                    <input matInput [ngModel]="option.label" (ngModelChange)="updateOption(i, $event)">
                </mat-form-field>
                <button matIconButton (click)="removeOption(i)" class="-mt-6">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
        }
    </div>
</div>
