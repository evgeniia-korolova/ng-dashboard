<div class="p-4 rounded-lg w-full lg:h-[calc(100vh-150px)] overflow-y-auto border-gray-200 shadow-sm wrapper">
  <h3 class="text-xl font-medium text-center mb-4 text-[var(--mat-sys-primary)]">Form Elements</h3>
  <div
    class="flex flex-row flex-wrap lg:flex-col gap-4 elements-menu"
    cdkDropList
    cdkDropListSortingDisabled="true"
    [cdkDropListData]="'field-selector'"
    [cdkDropListEnterPredicate]="noDropAllowed"
  >
    @for (type of fieldTypes; track type.type) {
    <app-field-button [field]="type" />
    }
  </div>
</div>
