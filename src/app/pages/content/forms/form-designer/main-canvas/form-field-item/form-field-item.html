<div
  class="p-4 rounded-lg shadow-sm border border-gray-200 hover:border-black cursor-pointer pt-1"
  [class]="formService.selectedField()?.id === field().id ? '!border-rose-800' : ''"
  (click)="formService.setSelectedField(field().id)"
>
  <div class="flex items-center justify-between mb-1">
    <span class="text-sm">{{ field().type | titlecase }} </span>
    <button matIconButton class="-m-2" (click)="deleteField($event)">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
  <app-field-preview [field]="field()" />
  <!-- <ng-container
    [ngComponentOutlet]="previewComponent()"
    [ngComponentOutletInputs]="{ field: field() }"
  ></ng-container> -->
</div>
