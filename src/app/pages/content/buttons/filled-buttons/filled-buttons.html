<div class="my-buttons-panel p-6 flex flex-col gap-4 rounded-lg mat-elevation-z3">
    <h3 class="text-lg">Filled Buttons</h3>
    <div class="flex gap-2 flex-wrap">
        <button matButton="filled" [class]="variantClasses()">Primary</button>
        <button matButton="filled" [class]="variantClasses()" class="secondary">Secondary</button>
        <button matButton="filled" [class]="variantClasses()" class="accent">Accent</button>
        <button matButton="filled" [class]="variantClasses()" class="error">Error</button>
    </div>
</div>
