<div class="my-buttons-panel p-6 flex flex-col gap-4 rounded-lg mat-elevation-z3">
    <h3 class="text-lg">Outlined Buttons</h3>
    <div class="flex gap-2 flex-wrap">
        <button matButton="outlined" [class]="variantClasses()">Primary</button>
        <button matButton="outlined" class="secondary" [class]="variantClasses()">Secondary</button>
        <button matButton="outlined" class="accent" [class]="variantClasses()">Accent</button>
        <button matButton="outlined" class="error" [class]="variantClasses()">Error</button>
    </div>
</div>
