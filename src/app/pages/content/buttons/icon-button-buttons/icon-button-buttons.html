<div class="my-buttons-panel p-6 flex flex-col gap-4 rounded-lg mat-elevation-z3">
    <h3 class="text-lg">Fab Extended Buttons</h3>
    <div class="flex gap-2 flex-wrap">
        <div class="flex flex-col text-center text-sm gap-3">
            <button matFab extended class="primary" [class]="variantClasses()">
                <mat-icon>star</mat-icon>
                Favorite
            </button>
            <p class="italic">Primary</p>
        </div>
        <div class="flex flex-col text-center text-sm gap-3">
            
            <button  matFab extended class="secondary" [class]="variantClasses()">
                <mat-icon>add</mat-icon>
                Add Item
            </button>
            <p class="italic">Secondary</p>
        </div>
        <div class="flex flex-col text-center text-sm gap-3">
            <button matFab extended class="accent" [class]="variantClasses()">
                <mat-icon>save</mat-icon>
                Save
            </button>
            <p class="italic">Accent</p>
        </div>
        <div class="flex flex-col text-center text-sm gap-3">

            <button matFab extended class="error" [class]="variantClasses()">
                <mat-icon>delete</mat-icon>
                Delete
            </button>
            <p class="italic">Error</p>
        </div>
        <div class="flex flex-col text-center text-sm gap-3">
            <button matFab extended [class]="variantClasses()">
                <mat-icon>help</mat-icon>
                Help
            </button>
            <p class="italic">Default</p>
        </div>
        
        
    </div>
</div>
