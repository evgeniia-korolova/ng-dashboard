<div class="my-buttons-panel p-6 flex flex-col gap-4 rounded-lg mat-elevation-z3">
    <h3 class="text-lg">Icon Buttons</h3>
    <div class="flex gap-2 flex-wrap">
        <button matIconButton class="primary" [class]="variantClasses()">
            <mat-icon>star</mat-icon>
        </button>
        <button matIconButton class="secondary" [class]="variantClasses()">
            <mat-icon>favorite</mat-icon>
        </button>
        <button matIconButton class="accent" [class]="variantClasses()">
            <mat-icon>share</mat-icon>
        </button>
        <button matIconButton class="error" [class]="variantClasses()">
            <mat-icon>delete</mat-icon>
        </button>
        <button matIconButton [class]="variantClasses()">
            <mat-icon>settings</mat-icon>
        </button>
        <button matIconButton class="secondary" [class]="variantClasses()">
            <mat-icon>edit</mat-icon>
        </button>
        
    </div>
</div>
