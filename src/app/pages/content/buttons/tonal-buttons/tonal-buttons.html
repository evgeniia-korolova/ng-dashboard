<div class="my-buttons-panel p-6 flex flex-col gap-4 rounded-lg mat-elevation-z3">
    <h3 class="text-lg">Tonal Buttons</h3>
    <div class="flex gap-2 flex-wrap">
        <button matButton="tonal" [class]="variantClasses()">Default</button>
        <button matButton="tonal" class="secondary" [class]="variantClasses()">Secondary</button>
        <button matButton="tonal" class="accent" [class]="variantClasses()">Accent</button>
        <button matButton="tonal" class="error" [class]="variantClasses()">Error</button>
    </div>
</div>
