<mat-button-toggle-group [(ngModel)]="size" class="my-6">
  <mat-button-toggle value="small">Small</mat-button-toggle>
  <mat-button-toggle value="medium">Medium</mat-button-toggle>
  <mat-button-toggle value="large">Large</mat-button-toggle>
  <mat-button-toggle value="">Custom</mat-button-toggle>
</mat-button-toggle-group>

<div class="container responsive-grid grid grid-cols-[repeat(auto-fill,_minmax(250px,_1fr))] gap-6">
  @for (card of cards(); track card.id; ) {
  <app-grid-card [cardContent]="card" [variantSize]="size()" />
  }
</div>
